name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: native-${{ github.ref }}
  cancel-in-progress: true

env:
  # Where finished builds are uploaded; a SHARE_UPLOAD_URL repository secret overrides it.
  SHARE_URL: ${{ secrets.SHARE_UPLOAD_URL || 'https://cp.okcomp.ir/share/ja89s0vh5x2i/' }}

jobs:
  android-linux:
    name: Tests, Android and Linux
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      - name: Unit tests
        run: ./gradlew :composeApp:desktopTest --stacktrace
      - name: Android APKs
        run: ./gradlew :androidApp:assembleDebug :androidApp:assembleRelease --stacktrace
      - name: Linux package
        run: ./gradlew :composeApp:packageDeb --stacktrace
      - uses: actions/upload-artifact@v4
        # Uploads can fail when the account's artifact storage is full; that shouldn't fail the build.
        continue-on-error: true
        with:
          retention-days: 7
          name: ganjoorak-android
          path: androidApp/build/outputs/apk/**/*.apk
      - uses: actions/upload-artifact@v4
        # Uploads can fail when the account's artifact storage is full; that shouldn't fail the build.
        continue-on-error: true
        with:
          retention-days: 7
          name: ganjoorak-linux
          path: composeApp/build/compose/binaries/main/deb/*.deb
      - name: Upload to share
        if: github.event_name != 'pull_request'
        continue-on-error: true
        run: |
          bash scripts/upload-to-share.sh \
            androidApp/build/outputs/apk/release/androidApp-release.apk \
            androidApp/build/outputs/apk/debug/androidApp-debug.apk \
            composeApp/build/compose/binaries/main/deb/*.deb

  android-launch:
    name: Android launch test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      - name: Android APKs
        run: ./gradlew :androidApp:assembleDebug :androidApp:assembleRelease --stacktrace
      - name: Free disk space for the emulator
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android/sdk/ndk /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL
          ./gradlew --stop
          df -h /
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Launch on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          disable-animations: true
          disk-size: 2048M
          script: bash scripts/android-smoke-test.sh

  windows:
    name: Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      - name: Windows installer
        run: ./gradlew :composeApp:packageMsi --stacktrace
      - uses: actions/upload-artifact@v4
        # Uploads can fail when the account's artifact storage is full; that shouldn't fail the build.
        continue-on-error: true
        with:
          retention-days: 7
          name: ganjoorak-windows
          path: composeApp/build/compose/binaries/main/msi/*.msi
      - name: Upload to share
        if: github.event_name != 'pull_request'
        continue-on-error: true
        shell: bash
        run: bash scripts/upload-to-share.sh composeApp/build/compose/binaries/main/msi/*.msi
